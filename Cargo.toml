[package]
name = "macropad"
version = "0.2.0"
edition = "2024"

[dependencies]
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.35"
wry = "0.57"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
